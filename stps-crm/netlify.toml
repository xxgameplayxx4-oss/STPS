# Netlify-Konfiguration für STPS CRM.
# Die Site wird mit "Base directory" = stps-crm angelegt; alle Pfade sind relativ dazu.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # exceljs (Excel-Import/-Export) ist CommonJS und lässt sich nicht in das ESM-Bundle einbetten ("Dynamic require of …"):
  # Es wird deshalb als eigenes Paket mit der Function ausgeliefert.
  # web-push (Chat-Benachrichtigungen) ist ebenfalls CommonJS mit eigenen Abhängigkeiten (http_ece, jws …) und wird nur bei Bedarf geladen.
  external_node_modules = ["exceljs", "web-push"]

# Interne Dateien (Quellcode der Function, Paketdateien, Doku) nicht öffentlich ausliefern.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SHAREPOINT-SETUP.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/OUTLOOK-SETUP.md"
  to = "/404.html"
  status = 404
  force = true

# Sicherheits-Header + privates Tool (nicht indexieren). API-Antworten setzen «Cache-Control: no-store» selbst (api.mjs).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Installierbare App (PWA): Der Service Worker und das Manifest müssen immer frisch geprüft werden, sonst erreichen Updates die Geräte verzögert.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"
