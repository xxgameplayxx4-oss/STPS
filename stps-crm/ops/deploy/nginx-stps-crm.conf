# nginx-Site für das STPS CRM. Ablage: /etc/nginx/sites-available/stps-crm (Symlink nach sites-enabled).
# Domain ersetzen (crm.example.ch). Zertifikat: sudo certbot --nginx -d crm.example.ch
# gzip einmalig in /etc/nginx/nginx.conf oder hier (http-Kontext via conf.d) aktivieren; hier site-lokal.

# Login-Bremse: je Client (IPv6 auf /64 zusammengefasst) höchstens 5 Anfragen/Minute auf /api/login (Burst 10)
map $remote_addr $login_limit_key {
    ~^(?<v6prefix>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}): $v6prefix;
    default $remote_addr;
}
limit_req_zone $login_limit_key zone=stps_login:10m rate=5r/m;
limit_req_status 429;

upstream stps_crm { server 127.0.0.1:8888; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.ch;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.example.ch;

    ssl_certificate     /etc/letsencrypt/live/crm.example.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Datei-Upload bis 10 MB (+ Spielraum)
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Sicherheits-Header (die App setzt dieselben; hier doppelt abgesichert, auch für nginx-eigene Fehlerseiten)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /api/login {
        limit_req zone=stps_login burst=10 nodelay;
        proxy_pass http://stps_crm;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Nf-Client-Connection-Ip "";
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://stps_crm;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Von aussen mitgeschickte Header nie durchreichen (X-Real-IP/X-Forwarded-For oben werden überschrieben)
        proxy_set_header X-Nf-Client-Connection-Ip "";
        proxy_read_timeout 60s;
    }
}
